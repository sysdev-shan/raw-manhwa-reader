[package]
name = "raw-reader"
version = "0.1.0"
description = "RAW: lightweight manhwa reader"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["default-tls"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
